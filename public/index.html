<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ذهين">
    <title>ذهين - لعبة المسابقات الذهنية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="screen active">
        <div class="splash-content">
            <img src="images/splash.png" alt="ذهين" class="splash-logo">
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <h1 class="game-title">ذهين</h1>
            <p class="login-subtitle">لعبة المسابقات الذهنية الجماعية</p>
            
            <div class="login-tabs">
                <button class="login-tab active" data-tab="signin">تسجيل الدخول</button>
                <button class="login-tab" data-tab="signup">إنشاء حساب</button>
            </div>
            
            <!-- Sign In Form -->
            <form id="signin-form" class="login-form">
                <div class="input-group">
                    <label>البريد الإلكتروني أو اسم المستخدم</label>
                    <input type="text" id="signin-username" placeholder="أدخل بريدك الإلكتروني" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="signin-password" placeholder="أدخل كلمة المرور">
                </div>
                <div class="forgot-password">
                    <a href="#" id="forgot-password-link">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" id="signin-btn" class="primary-btn">دخول</button>
            </form>
            
            <!-- Sign Up Form -->
            <form id="signup-form" class="login-form hidden">
                <div class="input-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="signup-fullname" placeholder="أدخل اسمك الكامل" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="signup-email" placeholder="أدخل بريدك الإلكتروني" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="signup-username" placeholder="اختر اسم مستخدم" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="signup-password" placeholder="أدخل كلمة مرور قوية">
                </div>
                <div class="input-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="signup-password-confirm" placeholder="أعد إدخال كلمة المرور">
                </div>
                <button type="submit" id="signup-btn" class="primary-btn">إنشاء حساب</button>
            </form>
            
            <!-- Reset Password Form -->
            <form id="reset-form" class="login-form hidden">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="reset-email" placeholder="أدخل بريدك الإلكتروني" autocomplete="off">
                </div>
                <button type="submit" id="reset-btn" class="primary-btn">إرسال رابط إعادة التعيين</button>
                <button type="button" id="back-to-signin" class="secondary-btn">العودة لتسجيل الدخول</button>
            </form>
            
            <div class="auth-divider">
                <span>أو</span>
            </div>
            
            <button id="guest-login-btn" class="guest-login">دخول كضيف</button>
        </div>
    </div>

    <!-- Home Screen -->
    <div id="home-screen" class="screen">
        <div class="home-container">
            <h1 class="game-title">ذهين</h1>
            <div class="home-actions">
                <button id="start-game-btn" class="primary-btn large">ابدأ اللعب</button>
                <button id="logout-btn" class="secondary-btn">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <!-- Category Selection Screen -->
    <div id="category-screen" class="screen">
        <div class="category-container">
            <h2 class="screen-title">اختر الفئات (3-6)</h2>
            <div id="categories-grid" class="categories-grid">
                <!-- Categories will be loaded here -->
            </div>
            <div class="category-footer">
                <span id="selected-count" class="selected-count">0/6</span>
                <button id="next-categories-btn" class="primary-btn" disabled>التالي</button>
            </div>
        </div>
    </div>

    <!-- Team Names Screen -->
    <div id="team-names-screen" class="screen">
        <div class="team-names-container">
            <h2 class="screen-title">أسماء الفرق</h2>
            <div class="team-inputs">
                <div class="team-input-group">
                    <label>الفريق الأول</label>
                    <input type="text" id="team1-name" placeholder="فريق 1" value="فريق 1">
                </div>
                <div class="team-input-group">
                    <label>الفريق الثاني</label>
                    <input type="text" id="team2-name" placeholder="فريق 2" value="فريق 2">
                </div>
            </div>
            <button id="start-playing-btn" class="primary-btn large">ابدأ اللعبة</button>
        </div>
    </div>

    <!-- Game Board Screen -->
    <div id="game-board-screen" class="screen">
        <div class="game-header">
            <div class="team-score" id="team1-score">
                <div class="team-name" id="team1-display">فريق 1</div>
                <div class="score" id="team1-points">0</div>
                <div class="score-controls">
                    <button class="score-btn" data-team="1" data-action="add">+100</button>
                    <button class="score-btn" data-team="1" data-action="subtract">-100</button>
                </div>
            </div>
            <div class="turn-indicator" id="turn-indicator"></div>
            <div class="team-score" id="team2-score">
                <div class="team-name" id="team2-display">فريق 2</div>
                <div class="score" id="team2-points">0</div>
                <div class="score-controls">
                    <button class="score-btn" data-team="2" data-action="add">+100</button>
                    <button class="score-btn" data-team="2" data-action="subtract">-100</button>
                </div>
            </div>
        </div>
        <div id="game-board" class="game-board">
            <!-- Game board will be generated here -->
        </div>
    </div>

    <!-- Question Screen -->
    <div id="question-screen" class="screen">
        <div class="question-container">
            <button id="close-question-btn" class="close-question-btn">✕</button>
            <div class="question-header">
                <img id="question-category-img" src="" alt="" class="question-category-img">
                <div class="question-timer" id="question-timer">00:00</div>
                <button id="report-btn" class="report-btn">⚠️</button>
            </div>
            <div class="question-content">
                <h3 id="question-text" class="question-text"></h3>
                <div id="question-image-container" class="question-image-container" style="display: none;">
                    <img id="question-image" class="question-image" alt="">
                </div>
                <div id="answer-section" class="answer-section hidden">
                    <p id="answer-text" class="answer-text"></p>
                </div>
            </div>
            <div class="question-actions">
                <button id="show-answer-btn" class="primary-btn">إظهار الإجابة</button>
                <div id="team-selection" class="team-selection hidden">
                    <button class="team-select-btn" data-team="1" id="select-team1"></button>
                    <button class="team-select-btn" data-team="none">لا أحد</button>
                    <button class="team-select-btn" data-team="2" id="select-team2"></button>
                </div>
            </div>
            <div id="lifelines-container" class="lifelines-container hidden">
                <!-- Lifelines will appear here -->
            </div>
        </div>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="screen">
        <div class="win-container">
            <div class="confetti"></div>
            <h1 id="win-title" class="win-title">🎉</h1>
            <div class="final-scores">
                <div class="final-team">
                    <span id="final-team1-name"></span>
                    <span id="final-team1-score" class="final-score"></span>
                </div>
                <div class="final-team">
                    <span id="final-team2-name"></span>
                    <span id="final-team2-score" class="final-score"></span>
                </div>
            </div>
            <div class="win-actions">
                <button id="new-game-btn" class="primary-btn large">لعبة جديدة</button>
                <button id="home-btn" class="secondary-btn">الصفحة الرئيسية</button>
            </div>
        </div>
    </div>

    <!-- Tiebreaker Screen -->
    <div id="tiebreaker-screen" class="screen">
        <div class="tiebreaker-container">
            <h2 class="tiebreaker-title">⚡ كسر التعادل ⚡</h2>
            <div class="question-content">
                <h3 id="tiebreaker-question" class="question-text"></h3>
                <div id="tiebreaker-answer" class="answer-section hidden">
                    <p id="tiebreaker-answer-text" class="answer-text"></p>
                </div>
            </div>
            <div class="question-actions">
                <button id="show-tiebreaker-answer" class="primary-btn">إظهار الإجابة</button>
                <div id="tiebreaker-selection" class="team-selection hidden">
                    <button class="team-select-btn" data-team="1"></button>
                    <button class="team-select-btn" data-team="2"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
